[build]
  command = "node scripts/build-edge-data.js && node scripts/build-icons.js && npx tailwindcss -i src/assets/css/main.css -o src/assets/css/tailwind.css --minify && rm -rf _site && npx @11ty/eleventy"
  publish = "_site"

[build.environment]
  NODE_VERSION = "22"
  NODE_OPTIONS = "--max-old-space-size=4096"

# Dev server
[dev]
  command = "npx @11ty/eleventy --serve"
  port = 8888
  targetPort = 8080
  autoLaunch = false

# Headers for security and performance
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(self), microphone=(), geolocation=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Service-Worker-Allowed = "/"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Content-Type = "application/manifest+json"
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/api/*"
  [headers.values]
    X-Robots-Tag = "noindex"

# Redirects for SEO
[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301

# Trailing slash normalization — fallback redirect rules
# Primary normalization is handled by the trailing-slash edge function (200 rewrite).
# These 301 rules only fire when the edge function is bypassed (e.g. on error).
