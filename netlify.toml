# Universal trailing-slash normalization (runs FIRST)
# Rewrites /path → /path/ internally (200) instead of letting Netlify's
# default 301 redirect fire.  Eliminates "Page with redirect" in Google
# Search Console across ALL pages — static and edge-rendered.
[[edge_functions]]
  function = "trailing-slash"
  path = "/*"

# Affiliate redirects handled by edge function
[[edge_functions]]
  function = "affiliate-redirect"
  path = "/go/*"

# Dynamic vehicle pages handled by edge function
# These patterns cover all make/state, model/state, and model-year/state combinations
# rendered at the edge instead of as static HTML files
[[edge_functions]]
  function = "vehicle-pages"
  path = "/makes/*/in/*"

[[edge_functions]]
  function = "vehicle-pages"
  path = "/makes/*/*/in/*"

[[edge_functions]]
  function = "vehicle-pages"
  path = "/makes/*/*/*/in/*"

# AI chat. Must stay above the 404 fallback so the function, not the 404 page, answers.
[[redirects]]
  from = "/api/ai-chat"
  to = "/.netlify/functions/ai-chat"
  status = 200

